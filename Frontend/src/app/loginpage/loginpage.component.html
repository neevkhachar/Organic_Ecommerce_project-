<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            width: 380px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .login-header h1 {
            color: #2e7d32;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .login-header p {
            color: #555;
            font-size: 14px;
            font-weight: 300;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            color: #33691e;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #f5f5f5;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(67, 160, 71, 0.4);
        }
        
        .login-button {
            width: 100%;
            background: linear-gradient(to right, #43a047, #1b5e20);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(67, 160, 71, 0.3);
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(67, 160, 71, 0.4);
        }
        
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }
        
        .register-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .register-link a:hover {
            color: #1b5e20;
            text-decoration: underline;
        }
        
        /* Decorative elements */
        .decoration {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%);
            opacity: 0.1;
            z-index: -1;
        }
        
        .decoration-1 {
            width: 100px;
            height: 100px;
            top: 10%;
            left: 15%;
        }
        
        .decoration-2 {
            width: 150px;
            height: 150px;
            bottom: 10%;
            right: 15%;
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Please sign in to continue</p>
        </div>
        
        <form [formGroup]="loginform" (ngSubmit)="loginsubmit(loginform.value)">
            <div class="form-group">
                <label for="username" >Email</label>
                <input type="email" id="username" formControlName="email" name="Email" placeholder="Enter your Email">
                <small *ngIf="loginform.get('email')?.invalid && loginform.get('email')?.touched" style="color: #e53e3e; font-size: 12px; margin-top: 5px; display: block;">
                    Please enter a valid email address.
                </small>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password" name="password" placeholder="Enter your password">
                <small *ngIf="loginform.get('password')?.invalid && loginform.get('password')?.touched" style="color: #e53e3e; font-size: 12px; margin-top: 5px; display: block;">
                    Password is required.
                </small>
            </div>
            
            <button type="submit" class="login-button" [disabled]="isLoading">
                <span *ngIf="!isLoading">Login</span>
                <span *ngIf="isLoading">Logging in...</span>
            </button>
            
            <div class="register-link">
                Don't have an account? <a routerLink="../SignUp" >Create one</a>
            </div>
        </form>
    </div>
</body>
</html>
