<div class="shop-container">
  <div class="shop-header">
    <h1>Organic Shop</h1>
    <p>Discover our fresh, sustainable, and organic products</p>
  </div>

  <div class="shop-content">
    <aside class="sidebar">
      <h3>Categories</h3>
      <ul class="category-list">
        <li *ngFor="let cat of categories" 
            [class.active]="selectedCategory === cat"
            (click)="filterByCategory(cat)">
          {{ cat }}
        </li>
      </ul>
    </aside>

    <main class="products-area">
      <div *ngIf="isLoading" class="loading-spinner">
        Loading products...
      </div>

      <div *ngIf="!isLoading && filteredProducts.length === 0" class="no-products">
        No products found in this category.
      </div>

      <div class="products-grid" *ngIf="!isLoading">
        <div class="product-card" *ngFor="let product of filteredProducts">
          <div class="product-image">
            <img [src]="product.image || 'https://via.placeholder.com/300x300?text=Product'" [alt]="product.name">
            <div class="badge" *ngIf="product.stock < 10 && product.stock > 0">Low Stock</div>
            <div class="badge out-of-stock" *ngIf="product.stock === 0">Out of Stock</div>
          </div>
          <div class="product-info">
            <span class="product-brand">{{ product.brand }}</span>
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-desc">{{ product.description }}</p>
            <div class="product-footer">
              <span class="product-price">${{ product.price | number:'1.2-2' }}</span>
              <button class="add-to-cart-btn" 
                      (click)="addToCart(product)" 
                      [disabled]="product.stock === 0">
                + Add
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
