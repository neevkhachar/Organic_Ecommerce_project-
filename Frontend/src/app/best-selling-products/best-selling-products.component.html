<section id="best-selling" class="products-carousel">
        <div class="container-lg overflow-hidden py-5">
                <div class="row">
                        <div class="col-md-12">
                                <div class="section-header d-flex flex-wrap justify-content-between my-4">
                                        <h2 class="section-title">Best Selling Products</h2>
                                        <div class="d-flex align-items-center">
                                                <a routerLink="/shop" class="btn btn-primary me-2">View All</a>
                                        </div>
                                </div>
                        </div>
                </div>
                <div class="row">
                        <div class="col-md-12">
                                <div class="d-flex flex-wrap gap-3 justify-content-start">
                                        <div class="product-item" *ngFor="let product of products" style="width: 220px;">
                                                <figure>
                                                        <img [src]="product.image" [alt]="product.name" class="tab-image" style="width:100%; height:180px; object-fit:cover; border-radius:8px;">
                                                </figure>
                                                <div class="d-flex flex-column text-center">
                                                        <h3 class="fs-6 fw-normal">{{ product.name }}</h3>
                                                        <div>
                                                                <span class="text-muted small">{{ product.brand }} · {{ product.salesCount }} sold</span>
                                                        </div>
                                                        <div class="d-flex justify-content-center align-items-center gap-2 my-1">
                                                                <span class="text-dark fw-semibold">${{ product.price | number:'1.2-2' }}</span>
                                                        </div>
                                                        <div class="button-area p-3 pt-0">
                                                                <button class="btn btn-primary rounded-1 p-2 fs-7 btn-cart w-100" (click)="addToCart(product)">
                                                                        <svg width="18" height="18"><use xlink:href="#cart"></use></svg> Add to Cart
                                                                </button>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                        </div>
                </div>
        </div>
</section>
